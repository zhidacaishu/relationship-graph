<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239b84df' stroke-width='1.6'%3E%3Ccircle cx='5' cy='12' r='2.5'/%3E%3Ccircle cx='15' cy='5' r='2.5'/%3E%3Ccircle cx='19' cy='17' r='2.5'/%3E%3Cpath d='m7.1 10.5 5.8-4M7.4 12.7l9.2 3.5M16.2 7.3l1.7 7.3'/%3E%3C/svg%3E">
  <title>Obsidian Graph — Unweighted</title>
  <style>
    :root {
      font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
      color: #d7d3dc;
      background: #1e1e1e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #1e1e1e;
    }

    main {
      width: min(520px, calc(100vw - 48px));
      padding: 36px;
      border: 1px solid #3a383d;
      border-radius: 12px;
      background: #252427;
      box-shadow: 0 18px 50px rgb(0 0 0 / 24%);
    }

    small {
      color: #9b84df;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 10px;
      font-size: 24px;
      font-weight: 600;
    }

    p {
      margin: 0;
      color: #aaa6ad;
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <main>
    <small>Reserved project</small>
    <h1>无权重 Obsidian 风格图谱</h1>
    <p>该子项目已预留，图谱实现尚未开始。当前可运行的加权图谱位于 apps/weighted。</p>
  </main>
</body>
</html>
